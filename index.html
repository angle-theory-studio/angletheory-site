<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ANGLE Theory — independent creative studio.">
  <title>ANGLE Theory</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f4f1ea;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 5%;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    main {
      min-height: 78vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6%;
    }

    h1 {
      font-size: clamp(64px, 15vw, 190px);
      line-height: 0.82;
      letter-spacing: -0.07em;
      max-width: 1200px;
    }

    .theory {
      font-weight: 300;
    }

    .intro {
      margin-top: 50px;
      max-width: 520px;
      font-size: clamp(19px, 2.2vw, 30px);
      line-height: 1.25;
    }

    .contact {
      margin-top: 45px;
      display: inline-block;
      border-bottom: 1px solid #111;
      padding-bottom: 4px;
      font-size: 17px;
    }

    footer {
      display: flex;
      justify-content: space-between;
      padding: 30px 5%;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 6%;
      }

      main {
        padding: 8%;
      }

      footer {
        padding: 25px 6%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">ANGLE Theory</div>
    <a href="mailto:hello@angletheory.studio">Contact</a>
  </header>

  <main>
    <h1>
      ANGLE<br>
      <span class="theory">Theory</span>
    </h1>

    <p class="intro">
      An independent studio for sharp ideas, considered design and new perspectives.
    </p>

    <a class="contact" href="mailto:hello@angletheory.studio">
      hello@angletheory.studio
    </a>
  </main>

  <footer>
    <span>ANGLE Theory</span>
    <span>© 2026</span>
  </footer>

</body>
</html>
